<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #04070d;
      --surface: rgba(13, 20, 36, 0.72);
      --surface-solid: #0d1424;
      --border: rgba(56, 189, 248, 0.22);
      --border-bright: rgba(56, 189, 248, 0.65);
      --cyan: #38bdf8;
      --violet: #a855f7;
      --emerald: #34d399;
      --amber: #fbbf24;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.75rem 1rem 4.5rem;
      overflow-x: hidden;
      position: relative;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(to right, rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at 50% 20%, #000 45%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 20%, #000 45%, transparent 90%);
      animation: gridDrift 24s linear infinite;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.16), transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.14), transparent 42%);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes gridDrift {
      0% { background-position: 0 0; }
      100% { background-position: 42px 42px; }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.75; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.04); }
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
    }

    header {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.08);
      overflow: hidden;
      animation: fadeDown 0.5s ease-out both;
    }

    header::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
      animation: scanLine 4.5s ease-in-out infinite;
    }

    @keyframes scanLine {
      0% { left: -60%; }
      100% { left: 120%; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .eyebrow {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      animation: blinkDot 1.8s infinite;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }

    h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;

      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f8fafc;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.55rem;

    .boys-logo-canvas {

      font-family: 'Orbitron', sans-serif;

      letter-spacing: 0.06em;

      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(251, 191, 36, 0.48);
      border-radius: 14px;
      padding: 0.95rem 1.25rem;
      margin-bottom: 1.35rem;
      box-shadow: 0 0 24px rgba(251, 191, 36, 0.12);

      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);

      gap: 0.45rem;

      animation: blinkDot 1.4s infinite;

    .announcement-text {
      color: #fef3c7;
      font-size: 0.93rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;

    .controls {

      grid-template-columns: 1fr 220px;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
      animation: fadeDown 0.6s ease-out both;

      border-radius: 12px;

      background: var(--surface);

      font-size: 0.8rem;

    .btn-copy:hover {

      color: #030712;

      border-color: var(--emerald);
      color: #022c22;

      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);

      position: fixed;
      inset: 0;
      background: rgba(2, 4, 10, 0.92);
      backdrop-filter: blur(8px);
      z-index: 100;

      justify-content: center;

      max-height: 88vh;
      border-radius: 12px;
      border: 1px solid var(--border-bright);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);

    .modal-close {
      position: fixed;
      top: 1rem;
      right: 1.25rem;
      background: var(--surface-solid);
      color: var(--cyan);
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 0.55rem 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .modal-close:hover {
      background: var(--cyan);
      color: #030712;
    }
  </style>
</head>

  <script>
    (function () {
      const img = new Image();
      img.src = 'boys-logo.jpg';
      img.onload = function () {
        const temp = document.createElement('canvas');
        temp.width = img.naturalWidth;
        temp.height = img.naturalHeight;
        const tctx = temp.getContext('2d');
        tctx.drawImage(img, 0, 0);

        const imgData = tctx.getImageData(0, 0, temp.width, temp.height);
        const d = imgData.data;
        let minX = temp.width, minY = temp.height, maxX = 0, maxY = 0;

        for (let y = 0; y < temp.height; y++) {
          for (let x = 0; x < temp.width; x++) {
            const i = (y * temp.width + x) * 4;
            const r = d[i], g = d[i + 1], b = d[i + 2];
            const whiteness = Math.min(r, g, b);
            if (whiteness > 210) {
              d[i + 3] = 0;
            } else if (whiteness > 140) {
              d[i + 3] = Math.round(((210 - whiteness) / 70) * 255);
            }
            if (d[i + 3] > 10) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        tctx.putImageData(imgData, 0, 0);

        const out = document.getElementById('boysLogo');
        if (maxX >= minX && maxY >= minY) {
          const pad = 4;
          const cw = maxX - minX + 1 + pad * 2;
          const ch = maxY - minY + 1 + pad * 2;
          out.width = cw;
          out.height = ch;
          out.getContext('2d').drawImage(
            temp,
            minX,
            minY,
            maxX - minX + 1,
            maxY - minY + 1,
            pad,
            pad,
            maxX - minX + 1,
            maxY - minY + 1
          );
        }
      };
    })();
  </script>
