<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Araullo // Post Assignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04070d;
      --surface: rgba(13, 20, 36, 0.72);
      --surface-solid: #0d1424;
      --border: rgba(56, 189, 248, 0.22);
      --border-bright: rgba(56, 189, 248, 0.65);
      --cyan: #38bdf8;
      --violet: #a855f7;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #f43f5e;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.75rem 1rem 4.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Cyber Grid + Ambient Orbs */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(to right, rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at 50% 20%, #000 45%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 20%, #000 45%, transparent 90%);
      animation: gridDrift 24s linear infinite;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.16), transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.14), transparent 42%);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes gridDrift {
      0% { background-position: 0 0; }
      100% { background-position: 42px 42px; }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.75; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.04); }
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* HUD Header */
    header {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.08);
      overflow: hidden;
      animation: fadeDown 0.5s ease-out both;
    }

    header::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
      animation: scanLine 4.5s ease-in-out infinite;
    }

    @keyframes scanLine {
      0% { left: -60%; }
      100% { left: 120%; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .eyebrow {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      animation: blinkDot 1.8s infinite;
    }

    h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.05rem, 2.6vw, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f8fafc;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .boys-logo-canvas {
      height: 2.2rem;
      width: auto;
      vertical-align: middle;
      filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.45));
      transform: translateY(1px);
    }

    .nav-link {
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border-bright);
      background: rgba(56, 189, 248, 0.1);
      color: #bae6fd;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: var(--cyan);
      color: #030712;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }

    /* HUD Panel */
    .panel {
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.35rem;
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.65);
      animation: fadeDown 0.6s ease-out both;
    }

    .panel.amber-panel {
      border-color: rgba(251, 191, 36, 0.35);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      margin: 0;
    }

    .panel-title.amber {
      color: var(--amber);
    }

    .field {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 0.45rem;
    }

    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 0.8rem 0.95rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(4, 7, 13, 0.78);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    textarea {
      min-height: 155px;
      resize: vertical;
      line-height: 1.55;
    }

    textarea.short {
      min-height: 82px;
    }

    input:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.22);
    }

    input[type="file"] {
      width: 100%;
      padding: 0.65rem;
      border-radius: 12px;
      border: 1px dashed var(--border-bright);
      background: rgba(4, 7, 13, 0.6);
      color: var(--muted);
      font-size: 0.88rem;
      cursor: pointer;
    }

    .preview-box {

      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #03050a;
      max-height: 220px;
    }

    .preview-box img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      display: block;
    }

    .btn-row {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .btn-primary {

      padding: 0.88rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border-bright);

      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;

    .btn-primary:hover:not(:disabled) {

      color: #030712;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.55);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-amber {
      flex: 1;
      padding: 0.78rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(251, 191, 36, 0.55);
      background: rgba(251, 191, 36, 0.16);
      color: #fef3c7;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .btn-amber:hover:not(:disabled) {
      background: var(--amber);
      color: #030712;
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.45);
    }

    .btn-ghost {
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(244, 63, 94, 0.45);
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-ghost:hover {
      background: var(--rose);
      color: #fff;
    }

    .status {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      display: none;

      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }

    .hidden { display: none !important; }
  </style>
</head>

  <script>
    (function () {
      const img = new Image();
      img.src = 'boys-logo.jpg';
      img.onload = function () {
        const temp = document.createElement('canvas');
        temp.width = img.naturalWidth;
        temp.height = img.naturalHeight;
        const tctx = temp.getContext('2d');
        tctx.drawImage(img, 0, 0);

        const imgData = tctx.getImageData(0, 0, temp.width, temp.height);
        const d = imgData.data;
        let minX = temp.width, minY = temp.height, maxX = 0, maxY = 0;

        for (let y = 0; y < temp.height; y++) {
          for (let x = 0; x < temp.width; x++) {
            const i = (y * temp.width + x) * 4;
            const r = d[i], g = d[i + 1], b = d[i + 2];
            const whiteness = Math.min(r, g, b);
            if (whiteness > 210) {
              d[i + 3] = 0;
            } else if (whiteness > 140) {
              d[i + 3] = Math.round(((210 - whiteness) / 70) * 255);
            }
            if (d[i + 3] > 10) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        tctx.putImageData(imgData, 0, 0);

        const out = document.getElementById('boysLogo');
        if (maxX >= minX && maxY >= minY) {
          const pad = 4;
          const cw = maxX - minX + 1 + pad * 2;
          const ch = maxY - minY + 1 + pad * 2;
          out.width = cw;
          out.height = ch;
          out.getContext('2d').drawImage(
            temp,
            minX,
            minY,
            maxX - minX + 1,
            maxY - minY + 1,
            pad,
            pad,
            maxX - minX + 1,
            maxY - minY + 1
          );
        }
      };
    })();
  </script>
