<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Class Assignment</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --border: #283044;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem 3rem;
    }
    .container { max-width: 640px; margin: 0 auto; }
    .back-link {
      display: inline-block;
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.4rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin: 1rem 0 0.35rem;
    }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
    .file-box {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      background: var(--bg);
      cursor: pointer;
    }
    .file-box:hover { border-color: var(--accent); }
    #preview {
      display: none;
      max-width: 100%;
      max-height: 250px;
      margin: 0.85rem auto 0;
      border-radius: 8px;
      object-fit: contain;
    }
    .btn-submit {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .msg.ok {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }
    .msg.err {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .btn-lock {
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-lock:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <a href="assignments.html" class="back-link">← Back to Class Assignment Hub</a>

    <!-- Admin Login Gate -->
    <div class="panel" id="loginPanel">
      <h1>Admin Access Required</h1>
      <div class="sub">Enter your username and password to post assignments.</div>

      <form id="loginForm" onsubmit="return false;">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />

        <button type="button" class="btn-submit" id="unlockBtn">Unlock Posting Form</button>
        <div class="msg" id="loginMsg"></div>
      </form>
    </div>

    <!-- Assignment Form -->
    <div class="panel" id="editorPanel" style="display: none;">
      <div class="top-bar">
        <h1>Post Assignment & Answers</h1>
        <button type="button" class="btn-lock" id="lockBtn">Lock</button>
      </div>
      <div class="sub">Anyone with the board link will see this submission.</div>

      <form id="form">
        <label for="subject">Subject</label>
        <input type="text" id="subject" list="subjectList" placeholder="e.g., Algebra, Biology, Literature" required />
        <datalist id="subjectList">
          <option value="Algebra">
          <option value="Biology">
          <option value="Literature">
          <option value="Social Studies">
          <option value="Filipino 8">
        </datalist>

        <label for="title">Assignment Title / Activity #</label>
        <input type="text" id="title" placeholder="e.g., Worksheet 2 - Quadratics" required />

        <label>Assignment Picture</label>
        <div class="file-box" id="fileBox">
          <div id="filePrompt">Tap to choose or take a photo</div>
          <img id="preview" alt="Preview" />
          <input type="file" id="photoInput" accept="image/*" style="display: none;" />
        </div>

        <label for="answers">Answers & Notes</label>
        <textarea id="answers" placeholder="Write your answers here..." required></textarea>

        <button type="submit" class="btn-submit" id="submitBtn">Publish Assignment</button>
        <div class="msg" id="msgBox"></div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const ADMIN_USER = 'admin';
      const ADMIN_PASS = 'rainier';
      const AUTH_STORAGE_KEY = 'class_hub_admin_unlocked';

      const loginPanel = document.getElementById('loginPanel');
      const editorPanel = document.getElementById('editorPanel');
      const unlockBtn = document.getElementById('unlockBtn');
      const loginMsg = document.getElementById('loginMsg');
      const lockBtn = document.getElementById('lockBtn');
      const userInput = document.getElementById('username');
      const passInput = document.getElementById('password');

      function setUnlocked(unlocked) {
        if (unlocked) {
          try { sessionStorage.setItem(AUTH_STORAGE_KEY, '1'); } catch (_) {}
          loginPanel.style.display = 'none';
          editorPanel.style.display = 'block';
        } else {
          try { sessionStorage.removeItem(AUTH_STORAGE_KEY); } catch (_) {}
          editorPanel.style.display = 'none';
          loginPanel.style.display = 'block';
        }
      }

      try {
        if (sessionStorage.getItem(AUTH_STORAGE_KEY) === '1') {
          setUnlocked(true);
        }
      } catch (_) {}

      function attemptLogin() {
        const user = userInput.value.trim().toLowerCase();
        const pass = passInput.value;

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
          loginMsg.className = 'msg';
          loginMsg.textContent = '';
          passInput.value = '';
          setUnlocked(true);
        } else {
          loginMsg.textContent = 'Invalid username or password.';
          loginMsg.className = 'msg err';
        }
      }

      unlockBtn.addEventListener('click', attemptLogin);
      passInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          attemptLogin();
        }
      });
      userInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          passInput.focus();
        }
      });

      lockBtn.addEventListener('click', function () {
        setUnlocked(false);
      });
    })();
  </script>
