<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Class Assignment</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b0d12;
      color: #f1f5f9;
      padding: 1.5rem 1rem 3rem;
    }
    .wrap { max-width: 600px; margin: 0 auto; }
    a { color: #60a5fa; text-decoration: none; display: inline-block; margin-bottom: 1rem; }
    .box {
      background: #141821;
      border: 1px solid #283044;
      border-radius: 12px;
      padding: 1.25rem;
    }
    label { display: block; margin-top: 0.9rem; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.7rem;
      border-radius: 8px;
      border: 1px solid #283044;
      background: #0b0d12;
      color: #f1f5f9;
      font-size: 1rem;
      font-family: inherit;
    }
    textarea { min-height: 140px; }
    button {
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.8rem;
      border: 0;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    #status { margin-top: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="assignments.html">← Back to Board</a>

    <div class="box" id="authBox">
      <h2>Admin Login</h2>
      <label for="u">Username</label>
      <input id="u" type="text" autocomplete="off" />
      <label for="p">Password</label>
      <input id="p" type="text" autocomplete="off" />
      <button id="loginBtn" type="button">Login</button>
      <div id="authErr" style="color:#f87171;margin-top:0.75rem;"></div>
    </div>

    <div class="box" id="postBox" style="display:none;">
      <h2>Post Assignment</h2>
      <form id="postForm">
        <label for="subject">Subject</label>
        <input id="subject" type="text" required />

        <label for="title">Title / Activity #</label>
        <input id="title" type="text" required />

        <label for="photo">Photo</label>
        <input id="photo" type="file" accept="image/*" />

        <label for="answers">Answers</label>
        <textarea id="answers" required></textarea>

        <button id="publishBtn" type="submit">Publish Assignment</button>
        <div id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const authBox = document.getElementById('authBox');
    const postBox = document.getElementById('postBox');
    const uEl = document.getElementById('u');
    const pEl = document.getElementById('p');
    const authErr = document.getElementById('authErr');

    if (sessionStorage.getItem('hub_ok') === '1') {
      authBox.style.display = 'none';
      postBox.style.display = 'block';
    }

    document.getElementById('loginBtn').addEventListener('click', function () {
      if (uEl.value.trim() === 'admin' && pEl.value === 'rainier') {
        sessionStorage.setItem('hub_ok', '1');
        authBox.style.display = 'none';
        postBox.style.display = 'block';
      } else {
        authErr.textContent = 'Wrong username or password.';
      }
    });
  </script>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://hnymghztclawsjcmodvq.supabase.co',
      'sb_publishable_n0klvUjn0JdKqzLkEruh-Q_FuiFVzSe'
    );

    const form = document.getElementById('postForm');
    const statusEl = document.getElementById('status');
    const publishBtn = document.getElementById('publishBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      publishBtn.disabled = true;
      statusEl.style.color = '#93c5fd';
      statusEl.textContent = 'Publishing...';

      try {
        let photoUrl = '';
        const file = document.getElementById('photo').files[0];

        if (file) {
          const ext = file.name.split('.').pop() || 'jpg';
          const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
          const { error: upErr } = await supabase.storage
            .from('assignment-photos')
            .upload(path, file, { cacheControl: '3600', upsert: false });
          if (upErr) throw upErr;

          const { data } = supabase.storage.from('assignment-photos').getPublicUrl(path);
          photoUrl = data.publicUrl;
        }

        const row = {
          subject: document.getElementById('subject').value.trim(),
          title: document.getElementById('title').value.trim(),
          answers: document.getElementById('answers').value.trim(),
          photo_url: photoUrl,
          created_date: new Date().toLocaleDateString(undefined, {
            month: 'short', day: 'numeric', year: 'numeric'
          })
        };

        const { error: insErr } = await supabase.from('assignments').insert([row]);
        if (insErr) throw insErr;

        statusEl.style.color = '#86efac';
        statusEl.textContent = 'Posted! Redirecting...';
        setTimeout(() => { location.href = 'assignments.html'; }, 700);
      } catch (err) {
        statusEl.style.color = '#f87171';
        statusEl.textContent = 'Error: ' + (err.message || err);
        publishBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
